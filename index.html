<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AFK Journey Inventory Solver</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
    }
    .container {
      max-width: 1200px;
      margin: auto;
    }
    .btn {
      padding: 6px 12px;
      margin: 8px 0;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn-primary { background: #007bff; color: white; }
    .btn-primary:hover { background: #0056b3; }
    .grid {
      display: grid;
      gap: 2px;
      justify-content: center;
      margin: 10px 0;
    }
    .board-cell, .shape-cell {
      width: 30px;
      height: 30px;
      background: white;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .board-cell.selected, .shape-cell.selected {
      background: black;
    }
    .shape-container {
      display: inline-block;
      margin: 10px;
    }
    #shapes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    #result {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AFK Journey – Inventory Solver</h1>
    <p style="text-align:center">
      Scegli la dimensione della board, disegna le shape e lascia che il solver trovi una soluzione.
    </p>

    <!-- Board Section -->
    <div id="board-container">
      <h2>Define Board</h2>
      <div style="margin: 12px 0; display:flex; gap:8px; align-items:center; justify-content:center;">
        <label for="board-size" style="margin:0;">Board size:</label>
        <select id="board-size">
          <option value="6">6×6</option>
          <option value="7">7×7</option>
          <option value="8">8×8</option>
          <option value="9">9×9</option>
          <option value="10" selected>10×10</option>
          <option value="12">12×12</option>
        </select>
        <button id="apply-size" class="btn btn-primary">Applica</button>
      </div>
      <div id="board" class="grid"></div>
      <button id="submit-board" class="btn btn-primary">Submit Board</button>
    </div>

    <!-- Shapes Section -->
    <div id="shape-container" style="display:none;">
      <h2>Define Shapes</h2>
      <div id="shapes"></div>
      <button id="submit-shapes" class="btn btn-primary">Submit Shapes</button>
    </div>

    <!-- Result Section -->
    <div id="result-container" style="display:none;">
      <h2>Result</h2>
      <div id="result" class="grid"></div>
      <button id="reset-page" class="btn btn-primary">Reset</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
